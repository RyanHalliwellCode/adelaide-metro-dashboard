<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adelaide Metro - Vehicle Map</title>

<!-- Leaflet, loaded from its CDN. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }

  /* Header on top, map fills the rest. */
  body { display: flex; flex-direction: column; }
  header {
    background: #1c2b3a;
    color: white;
    padding: 12px 20px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.75; }

  #map { flex: 1; width: 100%; }

  .legend {
    background: white;
    padding: 10px 14px;
    line-height: 1.6;
    font-size: 14px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    min-width: 190px;
  }
  .legend h2 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #555;
  }
  /* Whole row is clickable, not just the checkbox. */
  .legend label {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .legend .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin: 0 6px;
  }
  .legend .count {
    margin-left: auto;
    padding-left: 12px;
    color: #555;
    font-variant-numeric: tabular-nums;
  }
  .legend .total {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #ddd;
    display: flex;
    font-size: 13px;
    color: #555;
  }
  .legend .total .count { font-weight: 600; }

  .legend .live {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
  }
  .legend .live label { font-weight: 600; }
  .legend .status {
    margin-top: 4px;
    font-size: 12px;
    color: #666;
    line-height: 1.4;
  }
  .legend .status.error { color: #c0392b; }
  /* Dot only pulses while updates are actually coming through. */
  .legend .pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #bbb;
    margin-left: 6px;
  }
  .legend .pulse.on {
    background: #27ae60;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* Trip panel - sits over the map on the left when you click a vehicle. */
  .side-panel {
    position: absolute;
    top: 84px;
    left: 12px;
    width: 310px;
    max-height: calc(100% - 180px);
    display: none;
    flex-direction: column;
    background: white;
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.4);
    z-index: 1000;
    font-size: 13px;
  }
  .side-panel.open { display: flex; }
  .side-panel .head {
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
    border-left: 5px solid #999;
    border-radius: 4px 0 0 0;
  }
  .side-panel .route { font-size: 15px; font-weight: 600; }
  .side-panel .sub { color: #666; margin-top: 2px; }
  .side-panel .meta { color: #888; margin-top: 4px; font-size: 12px; }
  .side-panel .close {
    float: right;
    cursor: pointer;
    color: #999;
    font-size: 18px;
    line-height: 1;
    padding-left: 8px;
  }
  .side-panel .zoom {
    display: inline-block;
    margin-top: 6px;
    color: #1c6cb4;
    cursor: pointer;
    font-size: 12px;
  }
  .side-panel .stops { overflow-y: auto; padding: 6px 0; }
  .side-panel .stop {
    display: flex;
    gap: 10px;
    padding: 3px 12px;
    line-height: 1.5;
  }
  .side-panel .stop .t {
    color: #666;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Stops it has already gone past fade out, the one it's heading for stands out. */
  .side-panel .stop.past { opacity: 0.4; }
  .side-panel .stop.next { background: #fff5d6; font-weight: 600; }
  .side-panel .stop.next .t { color: #333; }
  /* Where the vehicle is sitting right now, as opposed to where it's headed. */
  .side-panel .stop.at { background: #dff0d8; font-weight: 600; }
  .side-panel .stop.at .t { color: #333; }
  .side-panel .tag { color: #b07000; font-weight: 400; font-size: 12px; white-space: nowrap; }
  .side-panel .tag.at { color: #3c763d; }
  .side-panel .empty { padding: 12px; color: #888; }

  /* Disruption notices. */
  .side-panel .alert {
    margin: 6px 12px 0;
    padding: 6px 8px;
    background: #fdf3e3;
    border-left: 3px solid #e08a1e;
    border-radius: 2px;
    font-size: 12px;
    line-height: 1.45;
  }
  .side-panel .alert .title { font-weight: 600; color: #8a5a10; }
  .side-panel .alert .body { color: #6b5638; margin-top: 2px; }
  .side-panel .alert .when { color: #9a7f5a; margin-top: 3px; font-size: 11px; }
  .alert-pin { background: none; border: none; }
  .side-panel .alert a { color: #1c6cb4; }
  .legend .alerts { margin-top: 4px; font-size: 12px; }
  .legend .alerts a { color: #b06a00; cursor: pointer; text-decoration: underline; }

  /* Leaflet gives divIcons a white box and border by default. */
  .route-arrow { background: none; border: none; }

  /* Route chips in the stop panel. */
  .side-panel .chips { margin-top: 4px; }
  .side-panel .chip {
    display: inline-block;
    padding: 1px 6px;
    margin: 2px 3px 0 0;
    border-radius: 3px;
    font-size: 11px;
    color: white;
    font-weight: 600;
    border: 1px solid transparent;
  }
  /* Outlined rather than filled, so a once-a-day school run doesn't read as
     an equal to a route running every ten minutes. */
  .side-panel .chip.school { background: white; font-weight: 500; }
  .side-panel .note { margin-top: 6px; color: #888; font-size: 12px; }

  /* The number actually painted on the vehicle. */
  .side-panel .badge {
    display: inline-block;
    padding: 1px 7px;
    margin-right: 7px;
    border-radius: 3px;
    color: white;
    font-size: 13px;
    font-weight: 700;
    vertical-align: 1px;
  }
  .side-panel .arrival.clickable { cursor: pointer; }
  .side-panel .arrival.clickable:hover { background: #eef4fb; }
  .side-panel .arrival.selected { background: #e2ecf7; }
  .side-panel .sched {
    display: flex;
    gap: 10px;
    padding: 3px 12px;
    line-height: 1.5;
  }
  .side-panel .sched .t {
    min-width: 62px;
    color: #333;
    font-variant-numeric: tabular-nums;
  }
  .side-panel .sched .num { font-weight: 600; margin-right: 5px; }
  .side-panel .sched.school .num { color: #8a6d3b; }
  .side-panel .sched .to { color: #666; }
  .side-panel .sched.clickable { cursor: pointer; }
  .side-panel .sched.clickable:hover { background: #eef4fb; }

  /* Time window controls on the stop panel. */
  .side-panel .window {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #eee;
    font-size: 12px;
    color: #555;
  }
  .side-panel .window input[type="time"] {
    font-size: 12px;
    padding: 1px 3px;
    margin: 0 4px;
  }
  .side-panel .window .draw {
    display: block;
    margin-top: 6px;
    cursor: pointer;
  }
  .side-panel .window .draw input { margin-right: 5px; }
  /* An arriving vehicle: how far off it is, then what it is. */
  .side-panel .arrival { display: flex; gap: 10px; padding: 4px 12px; align-items: baseline; }
  .side-panel .arrival .away {
    min-width: 62px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .side-panel .arrival .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 5px;
  }
  .side-panel .arrival .detail { color: #666; font-size: 12px; }
  .side-panel .arrival .notes { color: #4a7c59; font-style: italic; }
  /* Predicted time beside the scheduled one, coloured by which way it slipped. */
  .side-panel .pred { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .side-panel .pred.late { color: #c0392b; }
  .side-panel .pred.early { color: #1c6cb4; }
  .side-panel .arrival.gone { opacity: 0.45; }
  .side-panel .group {
    padding: 8px 12px 2px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
  }
</style>
</head>
<body>

<header>
  <h1>Adelaide Metro - Live Vehicle Locations</h1>
  <p>Live positions from the Adelaide Metro GTFS-realtime feed, matched against the published timetable. Filter by type, switch on live mode, or show stops and click one.</p>
</header>

<div id="map"></div>

<div id="trip" class="side-panel">
  <div class="head">
    <span class="close" id="trip-close">&times;</span>
    <div class="route" id="trip-route"></div>
    <div class="sub" id="trip-sub"></div>
    <div class="meta" id="trip-meta"></div>
    <span class="zoom" id="trip-zoom">Zoom to route</span>
    <span class="zoom" id="trip-back" style="display:none; margin-left:12px">&larr; Back to stop</span>
  </div>
  <div class="stops" id="trip-stops"></div>
</div>

<div id="stop" class="side-panel">
  <div class="head">
    <span class="close" id="stop-close">&times;</span>
    <div class="route" id="stop-name"></div>
    <div class="sub" id="stop-routes"></div>
    <div class="meta" id="stop-meta"></div>
    <div class="window" id="stop-window">
      <label>From <input type="time" id="stop-from"></label>
      <label>to <input type="time" id="stop-to"></label>
      <span class="zoom" id="stop-now">now</span>
      <label class="draw"><input type="checkbox" id="stop-draw"> Sketch every route in this window</label>
    </div>
  </div>
  <div class="stops" id="stop-arrivals"></div>
</div>

<script>
  // Adelaide city centre, where the map starts.
  const ADELAIDE_CENTER = [-34.9285, 138.6007];

  // Matches classify_vehicle() in main.py. Order sets the panel row order too.
  const TYPE_COLORS = {
    bus: "#1f77b4",
    train: "#d62728",
    tram: "#2ca02c",
    ferry: "#9467bd",
    unknown: "#7f7f7f",
  };

  const map = L.map("map").setView(ADELAIDE_CENTER, 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  // A layer per type means filtering is one call, not 400 marker updates.
  const layers = {};
  for (const type of Object.keys(TYPE_COLORS)) {
    layers[type] = L.layerGroup().addTo(map);
  }

  const counts = Object.fromEntries(Object.keys(TYPE_COLORS).map((t) => [t, 0]));

  function normaliseType(type) {
    // Anything without a colour falls back to unknown.
    return TYPE_COLORS[type] ? type : "unknown";
  }

  // vehicle id -> its marker, so a refresh can move markers instead of
  // rebuilding them. Rebuilding ~600 of them every cycle flickers badly and
  // throws away whatever you had selected.
  const markers = new Map();

  function markerKey(v) {
    return v.vehicle_id || v.trip_id;
  }

  function addMarker(v) {
    const type = normaliseType(v.type);
    const color = TYPE_COLORS[type];
    const marker = L.circleMarker([v.latitude, v.longitude], {
      radius: 6,
      color: color,
      fillColor: color,
      fillOpacity: 0.8,
    });
    // Reads entry.vehicle, not v, so a click always uses the latest position.
    const entry = { marker, type, vehicle: v };
    marker.on("click", () => showTrip(entry.vehicle));
    marker.addTo(layers[type]);

    const key = markerKey(v);
    if (key) markers.set(key, entry);
    return entry;
  }

  function renderCounts() {
    let total = 0;
    for (const [type, n] of Object.entries(counts)) {
      total += n;
      const el = document.getElementById(`count-${type}`);
      if (el) el.textContent = n;
    }
    const totalEl = document.getElementById("count-total");
    if (totalEl) totalEl.textContent = total;
    document.title = `Adelaide Metro - ${total} vehicles`;
  }

  // --- First render --------------------------------------------------------

  function drawAll(vehicles) {
    Object.keys(counts).forEach((t) => (counts[t] = 0));
    Object.values(layers).forEach((layer) => layer.clearLayers());
    markers.clear();
    vehicles.forEach((v) => {
      counts[normaliseType(v.type)] += 1;
      addMarker(v);
    });
    renderCounts();
  }

  async function firstRender(attempt = 0) {
    try {
      const response = await fetch("api/snapshot");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();

      // The server polls on startup, so an empty result just means we beat it.
      if (!data.vehicles.length && attempt < 6) {
        setStatus("Waiting for the first feed poll...");
        setTimeout(() => firstRender(attempt + 1), 700);
        return;
      }

      drawAll(data.vehicles);
      const age = Math.round(data.age_seconds || 0);
      setStatus(`Live mode off - ${data.count} vehicles, ${age}s old. Tick for live updates.`);
    } catch (err) {
      console.error("Snapshot failed:", err);
      setStatus("No vehicle data - is the feed reachable?", true);
    }
  }

  // Network-wide disruptions, shown as a count in the control panel. Clicking
  // it opens the full list in the side panel.
  let networkAlerts = [];

  // Pins for the disruptions we could tie to a real stop. The feed gives only
  // affected routes, so the server matches the stop named in the headline
  // against the timetable - about half of them can be placed.
  const alertLayer = L.layerGroup();

  function drawAlertPins() {
    alertLayer.clearLayers();
    networkAlerts.forEach((a) => {
      (a.stops || []).forEach((s) => {
        L.marker([s.latitude, s.longitude], {
          icon: L.divIcon({
            className: "alert-pin",
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            html:
              '<svg width="20" height="20" viewBox="0 0 20 20">' +
              '<path d="M10 2 L19 18 L1 18 Z" fill="#e08a1e" stroke="white" stroke-width="1.6"' +
              ' stroke-linejoin="round"/><text x="10" y="16" text-anchor="middle"' +
              ' font-size="11" font-weight="700" fill="white">!</text></svg>',
          }),
        })
          .bindTooltip(`${a.header}<br><i>${s.name}</i>`)
          .addTo(alertLayer);
      });
    });
  }

  async function loadAlerts() {
    try {
      const data = await (await fetch("api/alerts")).json();
      networkAlerts = data.alerts || [];
      const el = document.getElementById("alert-summary");
      if (el && networkAlerts.length) {
        const pinned = data.mapped || 0;
        el.innerHTML =
          `<a id="alert-open">${networkAlerts.length} disruptions</a>` +
          ` - ${pinned} on the map` +
          (data.upcoming && data.upcoming.length
            ? `, ${data.upcoming.length} starting later`
            : "");
      }
      drawAlertPins();
    } catch (err) {
      console.error("Loading alerts failed:", err);
    }
  }

  function showAllAlerts() {
    closeTrip();
    const panel = document.getElementById("stop");
    currentStopId = null;
    panel.classList.add("open");
    panel.querySelector(".head").style.borderLeftColor = "#e08a1e";
    // No departures here, so no time window or route sketching either.
    document.getElementById("stop-window").style.display = "none";
    document.getElementById("stop-name").textContent = "Network disruptions";
    document.getElementById("stop-routes").innerHTML = "";
    document.getElementById("stop-meta").textContent =
      `${networkAlerts.length} notices currently in force`;
    document.getElementById("stop-arrivals").innerHTML = renderAlerts(networkAlerts, 50);
  }

  document.addEventListener("click", (event) => {
    if (event.target.id === "alert-open") showAllAlerts();
  });

  // Panel goes up first so there is somewhere to report progress and errors.
  addFilterPanel();
  firstRender();
  loadAlerts();

  // --- Trip panel ----------------------------------------------------------

  // The line and stop dots for whatever vehicle is currently selected.
  const tripLayer = L.layerGroup().addTo(map);
  let tripBounds = null;
  let selectedKey = null;
  let cameFromStop = null;

  // One dot among several hundred identical ones is impossible to follow, so
  // the selected vehicle gets bigger and takes a dark outline.
  function clearHighlight() {
    if (selectedKey && markers.has(selectedKey)) {
      const entry = markers.get(selectedKey);
      entry.marker.setRadius(6);
      entry.marker.setStyle({ weight: 3, color: TYPE_COLORS[entry.type], fillOpacity: 0.8 });
    }
  }

  function highlightVehicle(key) {
    const entry = markers.get(key);
    if (!entry) return;
    entry.marker.setRadius(10);
    entry.marker.setStyle({ weight: 4, color: "#111", fillOpacity: 1 });
    entry.marker.bringToFront();
  }

  function closeTrip() {
    document.getElementById("trip").classList.remove("open");
    tripLayer.clearLayers();
    clearHighlight();
    tripBounds = null;
    selectedKey = null;
    cameFromStop = null;
  }

  // Which way is it going? A line alone can't say, and a route that passes your
  // stop in the wrong direction is useless to you.
  function addDirectionArrows(path, color, layer, count = 8, size = 16) {
    // Spaced by point index rather than distance - shape points are roughly
    // evenly spread, so this gives about the same number of arrows whether the
    // route is 95 points or 982.
    const step = Math.max(1, Math.round(path.length / count));
    const half = size / 2;
    for (let i = step; i < path.length - 1; i += step) {
      const [aLat, aLon] = path[i];
      const [bLat, bLon] = path[i + 1];
      const dy = bLat - aLat;
      const dx = (bLon - aLon) * Math.cos((aLat * Math.PI) / 180);
      if (!dx && !dy) continue;
      // 0 degrees is north, and the glyph is drawn pointing up.
      const heading = (Math.atan2(dx, dy) * 180) / Math.PI;

      L.marker(path[i], {
        interactive: false,
        keyboard: false,
        icon: L.divIcon({
          className: "route-arrow",
          iconSize: [size, size],
          iconAnchor: [half, half],
          // White fill outlined in the route colour, so the arrow reads against
          // the coloured line it sits on rather than blending into it.
          html:
            `<svg width="${size}" height="${size}" viewBox="0 0 16 16" style="transform:rotate(${heading}deg)">` +
            `<path d="M8 1 L13.5 14 L8 11 L2.5 14 Z" fill="white" stroke="${color}" stroke-width="1.8"` +
            ' stroke-linejoin="round"/></svg>',
        }),
      }).addTo(layer);
    }
  }

  function drawTripLine(data, color) {
    tripLayer.clearLayers();

    const stopPoints = data.stops
      .filter((s) => s.latitude !== null && s.longitude !== null)
      .map((s) => [s.latitude, s.longitude]);

    // shape is the surveyed path. Only fall back to joining the stops if a
    // trip somehow has no geometry, and it will look like it cuts corners.
    const path = data.shape && data.shape.length ? data.shape : stopPoints;
    if (!path.length) return;

    // White casing underneath so the line stays readable over dark map detail.
    L.polyline(path, { color: "white", weight: 7, opacity: 0.9 }).addTo(tripLayer);
    L.polyline(path, { color: color, weight: 4, opacity: 0.95 }).addTo(tripLayer);

    stopPoints.forEach((p) => {
      L.circleMarker(p, {
        radius: 4,
        color: color,
        fillColor: "white",
        fillOpacity: 1,
        weight: 2,
      }).addTo(tripLayer);
    });

    addDirectionArrows(path, color, tripLayer);

    // Green start, red end, so the two ends of the line are never ambiguous.
    if (stopPoints.length > 1) {
      L.circleMarker(stopPoints[0], {
        radius: 7, color: "white", weight: 2, fillColor: "#2e8b3d", fillOpacity: 1,
      }).addTo(tripLayer).bindTooltip(`Start: ${data.stops[0].name}`);
      const last = data.stops[data.stops.length - 1];
      L.circleMarker(stopPoints[stopPoints.length - 1], {
        radius: 7, color: "white", weight: 2, fillColor: "#c0392b", fillOpacity: 1,
      }).addTo(tripLayer).bindTooltip(`End: ${last.name}`);
    }

    tripBounds = L.latLngBounds(path);
  }

  // "15:47:00" -> "3:47 pm". GTFS writes after-midnight times as 24:xx and
  // 25:xx, so wrap the hour before working out am/pm.
  function formatTime(value) {
    if (!value) return "";
    const [hours, minutes] = value.split(":").map(Number);
    const hour24 = hours % 24;
    const suffix = hour24 < 12 ? "am" : "pm";
    const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
    return `${hour12}:${String(minutes).padStart(2, "0")} ${suffix}`;
  }

  // plain = a scheduled route with no vehicle on it, so nothing is "at" or
  // "next" and none of the stops are behind anything.
  function renderStops(data, autoScroll, plain) {
    const list = document.getElementById("trip-stops");
    // Both worked out server-side from the position we sent with the request.
    const atIndex = plain ? null : data.at_stop_index;
    const nextIndex = plain ? null : data.next_stop_index;

    list.innerHTML = data.stops
      .map((s, i) => {
        let cls = "stop";
        let tag = "";
        if (i === atIndex) {
          cls += " at";
          tag = ' <span class="tag at">(at this stop)</span>';
        } else if (i === nextIndex) {
          cls += " next";
          tag = ' <span class="tag">(next stop)</span>';
        } else if (!plain && (nextIndex === null || i < nextIndex)) {
          // Everything behind the vehicle, or the whole trip once it's over.
          cls += " past";
        }
        const time = formatTime(s.arrival || s.departure);
        // Show the predicted time next to the scheduled one when they differ,
        // so you can see the timetable slipping stop by stop.
        let predicted = "";
        if (s.predicted && s.predicted_delay !== null && Math.abs(s.predicted_delay) >= 2) {
          const late = s.predicted_delay > 0;
          predicted =
            ` <span class="pred ${late ? "late" : "early"}">${formatTime(s.predicted)}` +
            ` (${late ? "+" : ""}${s.predicted_delay})</span>`;
        }
        return `<div class="${cls}"><span class="t">${time}</span><span>${s.name}${tag}${predicted}</span></div>`;
      })
      .join("");

    // Nothing marked at all renders as a wall of grey, which reads like a bug.
    if (!plain && nextIndex === null && data.stops.length) {
      const last = data.stops[data.stops.length - 1];
      const note = document.createElement("div");
      note.className = "empty";
      note.textContent = `End of the line - due ${formatTime(last.arrival || last.departure)}.`;
      list.prepend(note);
    }

    // Only on opening. Doing it on every live refresh would yank the list back
    // every 15 seconds while you were trying to read further down it.
    if (autoScroll) {
      const focus = list.querySelector(".at") || list.querySelector(".next");
      if (focus) focus.scrollIntoView({ block: "center" });
    }
  }

  // quiet = a live refresh redrawing the panel that's already open, so skip the
  // loading state that would otherwise flash every 15 seconds.
  async function showTrip(v, quiet, fromStopId) {
    const panel = document.getElementById("trip");
    const type = normaliseType(v.type);
    const color = TYPE_COLORS[type];

    if (!quiet) clearHighlight();
    selectedKey = markerKey(v);
    highlightVehicle(selectedKey);

    if (fromStopId !== undefined) cameFromStop = fromStopId;
    document.getElementById("trip-back").style.display = cameFromStop ? "inline-block" : "none";

    // Both panels sit in the same spot, so only one can be open.
    closeStop();
    panel.classList.add("open");
    panel.querySelector(".head").style.borderLeftColor = color;
    if (!quiet) {
      document.getElementById("trip-route").textContent = `${type} ${v.route_id}`;
      document.getElementById("trip-sub").textContent = "Loading timetable...";
      document.getElementById("trip-meta").textContent = "";
      document.getElementById("trip-stops").innerHTML = "";
    }

    if (!v.trip_id) {
      document.getElementById("trip-sub").textContent = "No trip ID in the feed for this vehicle.";
      return;
    }

    try {
      // Send the position so the server can say where along the trip it is,
      // rather than the browser recomputing the same geometry.
      const query = new URLSearchParams({ lat: v.latitude, lon: v.longitude });
      const response = await fetch(`api/trip/${encodeURIComponent(v.trip_id)}?${query}`);
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.detail || `HTTP ${response.status}`);
      }
      const data = await response.json();

      // Lead with the number on the vehicle - that's what identifies it at a
      // stop. The long name describes the corridor, not this trip's direction.
      document.getElementById("trip-route").innerHTML =
        `<span class="badge" style="background:${color}">${data.route_short}</span>${data.route_name}`;
      document.getElementById("trip-sub").textContent = data.headsign
        ? `Towards ${data.headsign}`
        : `Route ${data.route_id}`;

      renderStops(data, !quiet);
      if (data.alerts && data.alerts.length) {
        document
          .getElementById("trip-stops")
          .insertAdjacentHTML("afterbegin", renderAlerts(data.alerts, 2));
      }
      drawTripLine(data, color);

      // speed is metres per second in the feed, which means nothing to anyone.
      const bits = [`Vehicle ${v.vehicle_id}`];
      if (v.speed !== null && v.speed !== undefined) {
        bits.push(`${Math.round(v.speed * 3.6)} km/h`);
      }
      bits.push(
        data.at_stop_index !== null
          ? `At ${data.stops[data.at_stop_index].name}`
          : "Between stops"
      );

      const late = data.delay_minutes;
      if (late !== null) {
        // Say when it's the operator's figure rather than our own guess.
        const source = data.delay_source === "predicted" ? " (predicted)" : "";
        if (late >= 2) bits.push(`${late} min late${source}`);
        else if (late <= -2) bits.push(`${Math.abs(late)} min early${source}`);
        else bits.push(`on time${source}`);
      }

      if (v.occupancy_text) bits.push(v.occupancy_text);
      if (v.wheelchair === true) bits.push("wheelchair accessible");
      else if (v.wheelchair === false) bits.push("no wheelchair access");
      if (v.air_conditioned === true) bits.push("air conditioned");
      if (v.schedule_relationship && v.schedule_relationship !== "SCHEDULED") {
        bits.push(v.schedule_relationship.toLowerCase());
      }
      document.getElementById("trip-meta").textContent = bits.join(" - ");
    } catch (err) {
      console.error("Trip lookup failed:", err);
      document.getElementById("trip-sub").textContent = String(err.message || err);
      document.getElementById("trip-stops").innerHTML =
        '<div class="empty">Timetable unavailable. Has gtfs.db been built?</div>';
    }
  }

  document.getElementById("trip-close").addEventListener("click", closeTrip);
  document.getElementById("trip-zoom").addEventListener("click", () => {
    if (tripBounds) map.fitBounds(tripBounds, { padding: [40, 40] });
  });

  // --- Stops ---------------------------------------------------------------

  // 9,167 stops is far too many to draw at once, so they only appear once
  // you're zoomed in enough for the view to hold a sensible number.
  const STOPS_MIN_ZOOM = 14;
  const stopsLayer = L.layerGroup();
  let stopsOn = false;
  let stopsRequest = 0;

  function stopsHint(text) {
    const el = document.getElementById("stops-hint");
    if (el) el.textContent = text;
  }

  async function loadStops() {
    if (!stopsOn) return;
    if (map.getZoom() < STOPS_MIN_ZOOM) {
      stopsLayer.clearLayers();
      stopsHint(`Zoom in to level ${STOPS_MIN_ZOOM} to see stops.`);
      return;
    }

    const b = map.getBounds();
    const query = new URLSearchParams({
      south: b.getSouth(),
      west: b.getWest(),
      north: b.getNorth(),
      east: b.getEast(),
    });

    // Panning fires these faster than they come back, so ignore stale replies.
    const ticket = ++stopsRequest;
    try {
      const data = await (await fetch(`api/stops?${query}`)).json();
      if (ticket !== stopsRequest || !stopsOn) return;

      stopsLayer.clearLayers();
      data.stops.forEach((s) => {
        // Colour and size by what serves the stop. A railway station and a bus
        // interchange can sit 50 m apart - Elizabeth's are - and identical
        // white dots give you no way to tell which one you're clicking.
        const modes = s.modes || [];
        const primary =
          ["train", "tram", "ferry"].find((m) => modes.includes(m)) || "bus";
        const isStation = primary !== "bus";

        L.circleMarker([s.latitude, s.longitude], {
          radius: isStation ? 7 : 4,
          color: isStation ? "#222" : "#444",
          weight: isStation ? 2 : 1,
          fillColor: modes.length ? TYPE_COLORS[primary] : "#fff",
          fillOpacity: 1,
        })
          .bindTooltip(s.name, { direction: "top" })
          .on("click", () => showStop(s.stop_id))
          .addTo(stopsLayer);
      });
      stopsHint(
        data.truncated
          ? `${data.stops.length}+ stops here - zoom in for the rest.`
          : `${data.stops.length} stops in view. Click one.`
      );
    } catch (err) {
      console.error("Loading stops failed:", err);
      stopsHint("Could not load stops.");
    }
  }

  function setStopsMode(on) {
    stopsOn = on;
    if (on) {
      stopsLayer.addTo(map);
      loadStops();
    } else {
      map.removeLayer(stopsLayer);
      stopsLayer.clearLayers();
      stopsHint("");
    }
  }

  map.on("moveend", loadStops);

  function closeStop() {
    document.getElementById("stop").classList.remove("open");
    sketchLayer.clearLayers();
  }

  // Disruptions are long and written for a web page, so show the headline and
  // trim the body - the full text is a click away on the operator's site.
  function shortDate(epoch) {
    if (!epoch) return null;
    return new Date(epoch * 1000).toLocaleDateString(undefined, {
      day: "numeric",
      month: "short",
      year: "numeric",
    });
  }

  function renderAlerts(alerts, limit = 4) {
    if (!alerts || !alerts.length) return "";
    const shown = alerts.slice(0, limit);
    const rows = shown
      .map((a) => {
        const body = a.description && a.description.length > 190
          ? `${a.description.slice(0, 190)}...`
          : a.description || "";
        const link = a.url
          ? ` <a href="${a.url}" target="_blank" rel="noopener">details</a>`
          : "";
        // Several of these have been in force for over a year, so say since when.
        const from = shortDate(a.starts);
        const to = shortDate(a.ends);
        const when = from
          ? `In force since ${from}${to ? `, until ${to}` : " (no end date given)"}`
          : to
          ? `Until ${to}`
          : "";
        return `<div class="alert"><div class="title">${a.header}</div>
                  <div class="body">${body}${link}</div>
                  ${when ? `<div class="when">${when}</div>` : ""}</div>`;
      })
      .join("");
    const more = alerts.length > limit
      ? `<div class="alert"><div class="body">and ${alerts.length - limit} more</div></div>`
      : "";
    return `<div class="group">Disruptions (${alerts.length})</div>${rows}${more}`;
  }

  function describeAway(a) {
    if (!a.inbound) return "been past";
    if (a.stops_away === 0) return "at stop";
    return `${a.stops_away} stop${a.stops_away === 1 ? "" : "s"}`;
  }

  function renderArrivals(data) {
    const list = document.getElementById("stop-arrivals");
    const inbound = data.approaching.filter((a) => a.inbound);
    const past = data.approaching.filter((a) => !a.inbound);

    // Extras the feed sends per vehicle that we used to throw away.
    const vehicleNotes = (a) => {
      const notes = [];
      if (a.occupancy_text) notes.push(a.occupancy_text);
      if (a.wheelchair === true) notes.push("wheelchair accessible");
      else if (a.wheelchair === false) notes.push("not wheelchair accessible");
      if (a.air_conditioned === true) notes.push("air conditioned");
      if (a.schedule_relationship && a.schedule_relationship !== "SCHEDULED") {
        notes.push(a.schedule_relationship.toLowerCase());
      }
      return notes;
    };

    const row = (a) => {
      const color = TYPE_COLORS[a.type] || TYPE_COLORS.unknown;
      const km = a.distance_m >= 1000
        ? `${(a.distance_m / 1000).toFixed(1)} km`
        : `${a.distance_m} m`;
      // Only vehicles we still have a marker for can be opened and highlighted.
      const clickable = markers.has(a.vehicle_id) ? " clickable" : "";

      // The operator's own prediction beats counting stops, when they give one.
      let when = describeAway(a);
      if (a.inbound && a.minutes_away !== null && a.minutes_away !== undefined) {
        when = a.minutes_away <= 0 ? "due now" : `${a.minutes_away} min`;
      }

      const bits = [`${km} away`];
      if (a.predicted) {
        bits.push(`expected ${formatTime(a.predicted)}`);
        if (a.predicted_delay >= 2) bits.push(`${a.predicted_delay} min late`);
        else if (a.predicted_delay <= -2) bits.push(`${Math.abs(a.predicted_delay)} min early`);
      } else {
        bits.push(`due ${formatTime(a.due)}`);
      }
      bits.push(`vehicle ${a.vehicle_id}`);
      const notes = vehicleNotes(a);

      return `
        <div class="arrival${a.inbound ? "" : " gone"}${clickable}" data-key="${a.vehicle_id}">
          <span class="away">${when}</span>
          <span>
            <span class="dot" style="background:${color}"></span><b>${a.route_short || a.route_id}</b>
            ${a.headsign ? `to ${a.headsign}` : ""}
            <div class="detail">${bits.join(" - ")}</div>
            ${notes.length ? `<div class="detail notes">${notes.join(" &middot; ")}</div>` : ""}
          </span>
        </div>`;
    };

    const schedRow = (s) => `
      <div class="sched clickable${s.school ? " school" : ""}"
           data-trip="${s.trip_id}" data-type="${s.type}" data-time="${s.time}">
        <span class="t">${formatTime(s.time)}</span>
        <span><span class="num">${s.route_short}</span><span class="to">${
          s.headsign || ""
        }${s.school ? " (school)" : ""}</span></span>
      </div>`;

    // Disruptions first - no point reading arrival times for a stop that has
    // been moved 30 metres up the road.
    let html = renderAlerts(data.alerts);

    if (data.approaching.length) {
      html +=
        (inbound.length ? `<div class="group">On the way (${inbound.length}) - click to follow</div>` : "") +
        inbound.map(row).join("") +
        (past.length ? `<div class="group">Already been past (${past.length})</div>` : "") +
        past.map(row).join("");
    } else {
      html +=
        '<div class="empty">Nothing live is running a trip that calls here right now.</div>';
    }

    // The timetable, which is the useful part when nothing is live.
    const w = data.window || {};
    if (data.scheduled && data.scheduled.length) {
      const heading = w.from || w.to
        ? `Departures ${formatTime(w.from) || "start of day"} to ${formatTime(w.to) || "end of day"} (${data.scheduled.length}) - click to draw`
        : "Scheduled from here today - click to draw";
      html += `<div class="group">${heading}</div>` + data.scheduled.map(schedRow).join("");
    } else if (w.from || w.to) {
      html += '<div class="empty">Nothing scheduled from this stop in that window today.</div>';
    } else if (data.next_service_day) {
      const n = data.next_service_day;
      html +=
        `<div class="group">Nothing more today - next is ${n.weekday}</div>` +
        n.departures.map(schedRow).join("");
    } else {
      html += '<div class="empty">No scheduled departures found in the current timetable.</div>';
    }

    list.innerHTML = html;
  }

  let currentStopId = null;
  let currentStopData = null;

  // Lines for every route leaving in the window, so you can see the spread.
  // The one you pick is drawn properly on tripLayer over the top - ten routes
  // in ten colours is a tangle nobody can read.
  //
  // Orange because it has to stand out against grey roads and green parks
  // without being mistaken for a mode colour: bus blue, train red, tram green
  // and ferry purple are all taken.
  const SKETCH_COLOR = "#ff7f0e";
  const sketchLayer = L.layerGroup().addTo(map);

  function stopWindow() {
    return {
      from: document.getElementById("stop-from").value,
      to: document.getElementById("stop-to").value,
    };
  }

  async function sketchRoutes(departures) {
    sketchLayer.clearLayers();
    if (!document.getElementById("stop-draw").checked || !departures.length) return;

    const byTrip = new Map(departures.map((d) => [d.trip_id, d]));
    const ids = departures.map((d) => d.trip_id).join(",");
    try {
      const data = await (await fetch(`api/shapes?trip_ids=${encodeURIComponent(ids)}`)).json();
      Object.entries(data.shapes).forEach(([tripId, points]) => {
        if (!points || points.length < 2) return;
        const departure = byTrip.get(tripId);

        // White casing underneath, same as the focused route, so the line
        // stays readable where it crosses dark map detail.
        L.polyline(points, { color: "white", weight: 5, opacity: 0.7 }).addTo(sketchLayer);
        L.polyline(points, { color: SKETCH_COLOR, weight: 3, opacity: 0.85 }).addTo(sketchLayer);

        // Fewer and smaller than on a selected route - direction is the whole
        // reason to look at these, but a dozen routes at eight arrows each
        // would bury the map.
        addDirectionArrows(points, SKETCH_COLOR, sketchLayer, 4, 13);

        // A 3px line is a small target, so an invisible fat one catches the
        // click. Clicking the line on the map is the obvious thing to try -
        // it used to do nothing, and only the list rows worked.
        L.polyline(points, { color: "transparent", weight: 14, opacity: 0 })
          .addTo(sketchLayer)
          .bindTooltip(
            departure
              ? `${departure.route_short} - ${departure.headsign || ""} (${formatTime(departure.time)})`
              : "route",
            { sticky: true }
          )
          .on("click", () => {
            if (departure) {
              showScheduledTrip(departure.trip_id, departure.type, departure.time);
            }
          });
      });
    } catch (err) {
      console.error("Sketching routes failed:", err);
    }
  }

  // Picking a scheduled route swaps the panel over to just that route and its
  // stops. Everything else goes away, and "Back to stop" brings it all back -
  // easier to read than one panel trying to show a stop and a route at once.
  async function showScheduledTrip(tripId, type, departureTime) {
    const panel = document.getElementById("trip");
    const color = TYPE_COLORS[normaliseType(type)];

    cameFromStop = currentStopId;
    closeStop();
    panel.classList.add("open");
    panel.querySelector(".head").style.borderLeftColor = color;
    document.getElementById("trip-back").style.display = "inline-block";
    document.getElementById("trip-route").textContent = "Loading route...";
    document.getElementById("trip-sub").textContent = "";
    document.getElementById("trip-meta").textContent = "";
    document.getElementById("trip-stops").innerHTML = "";

    try {
      const response = await fetch(`api/trip/${encodeURIComponent(tripId)}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();

      document.getElementById("trip-route").innerHTML =
        `<span class="badge" style="background:${color}">${data.route_short}</span>${data.route_name}`;
      document.getElementById("trip-sub").textContent = data.headsign
        ? `Towards ${data.headsign}`
        : `Route ${data.route_id}`;
      document.getElementById("trip-meta").textContent =
        `Scheduled ${formatTime(departureTime || data.stops[0].departure)} - ${data.stops.length} stops`;

      // plain: no vehicle, so nothing is "at" or "next" - just the timetable.
      renderStops(data, true, true);
      drawTripLine(data, color);
      if (tripBounds) map.fitBounds(tripBounds, { padding: [40, 40] });
    } catch (err) {
      console.error("Drawing route failed:", err);
      document.getElementById("trip-route").textContent = "Route unavailable";
      document.getElementById("trip-stops").innerHTML =
        '<div class="empty">Could not load that route.</div>';
    }
  }

  async function showStop(stopId) {
    closeTrip();
    currentStopId = stopId;
    const panel = document.getElementById("stop");
    // The panel is shared with the disruptions list, which has no timetable.
    document.getElementById("stop-window").style.display = "";
    panel.classList.add("open");
    panel.querySelector(".head").style.borderLeftColor = "#444";
    document.getElementById("stop-name").textContent = "Loading stop...";
    document.getElementById("stop-routes").innerHTML = "";
    document.getElementById("stop-meta").textContent = "";
    document.getElementById("stop-arrivals").innerHTML = "";

    try {
      const chosen = stopWindow();
      const query = new URLSearchParams();
      if (chosen.from) query.set("from_time", chosen.from);
      if (chosen.to) query.set("to_time", chosen.to);
      const suffix = query.toString() ? `?${query}` : "";

      const response = await fetch(`api/stop/${encodeURIComponent(stopId)}${suffix}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();

      document.getElementById("stop-name").textContent = data.stop.name;

      // School services are split out because they run once or twice a day on
      // school days only. Listed together with the regular routes they make a
      // stop look far busier than it is, and they're why this list is longer
      // than the one a journey planner shows.
      const regular = data.routes.filter((r) => !r.school);
      const school = data.routes.filter((r) => r.school);
      const chip = (r) => {
        const color = TYPE_COLORS[r.type] || TYPE_COLORS.unknown;
        const trips = `${r.trips} trip${r.trips === 1 ? "" : "s"} in the timetable`;
        return `<span class="chip${r.school ? " school" : ""}" style="${
          r.school ? `color:${color};border-color:${color}` : `background:${color}`
        }" title="${r.name} - ${trips}">${r.route_id}</span>`;
      };

      document.getElementById("stop-routes").innerHTML =
        `<div>${regular.length} route${regular.length === 1 ? "" : "s"} serve this stop</div>` +
        `<div class="chips">${regular.map(chip).join("")}</div>` +
        (school.length
          ? `<div class="note">plus ${school.length} school service${
              school.length === 1 ? "" : "s"
            }, school days only</div>` + `<div class="chips">${school.map(chip).join("")}</div>`
          : "");

      currentStopData = data;
      const inbound = data.approaching.filter((a) => a.inbound).length;
      document.getElementById("stop-meta").textContent =
        `Stop ${data.stop.code || data.stop.stop_id} - ${inbound} vehicle${inbound === 1 ? "" : "s"} heading here now`;

      renderArrivals(data);
      sketchRoutes(data.scheduled);
    } catch (err) {
      console.error("Stop lookup failed:", err);
      document.getElementById("stop-name").textContent = "Stop unavailable";
      document.getElementById("stop-arrivals").innerHTML =
        '<div class="empty">Could not load this stop. Has gtfs.db been built?</div>';
    }
  }

  document.getElementById("stop-close").addEventListener("click", closeStop);

  // Delegated, because both lists are rebuilt on every stop lookup.
  document.getElementById("stop-arrivals").addEventListener("click", (event) => {
    const live = event.target.closest(".arrival.clickable");
    if (live) {
      const entry = markers.get(live.dataset.key);
      if (entry) showTrip(entry.vehicle, false, currentStopId);
      return;
    }
    // A scheduled departure has no vehicle yet, so show the route on its own.
    const scheduled = event.target.closest(".sched.clickable");
    if (scheduled) {
      showScheduledTrip(scheduled.dataset.trip, scheduled.dataset.type, scheduled.dataset.time);
    }
  });

  function applyWindow() {
    if (currentStopId) showStop(currentStopId);
  }

  document.getElementById("stop-from").addEventListener("change", applyWindow);
  document.getElementById("stop-to").addEventListener("change", applyWindow);
  document.getElementById("stop-draw").addEventListener("change", () => {
    if (currentStopData) sketchRoutes(currentStopData.scheduled);
  });
  document.getElementById("stop-now").addEventListener("click", () => {
    document.getElementById("stop-from").value = "";
    document.getElementById("stop-to").value = "";
    applyWindow();
  });

  document.getElementById("trip-back").addEventListener("click", () => {
    if (cameFromStop) showStop(cameFromStop);
  });

  // --- Live mode -----------------------------------------------------------

  // Countdown is for show, but hitting zero fires the refresh. Each response
  // resyncs it to the server's next_refresh_in so we don't drift out of step.
  let liveOn = false;
  let countdown = 0;
  let tickTimer = null;
  let fetching = false;

  function statusEl() {
    return document.getElementById("live-status");
  }

  function setStatus(text, isError) {
    const el = statusEl();
    if (!el) return;
    el.textContent = text;
    el.classList.toggle("error", Boolean(isError));
  }

  function setPulse(on) {
    const el = document.getElementById("live-pulse");
    if (el) el.classList.toggle("on", on);
  }

  function replaceLiveVehicles(vehicles) {
    const seen = new Set();

    vehicles.forEach((v) => {
      const type = normaliseType(v.type);
      const key = markerKey(v);
      seen.add(key);

      const entry = key ? markers.get(key) : null;
      if (entry && entry.type === type) {
        entry.marker.setLatLng([v.latitude, v.longitude]);
        entry.vehicle = v;
      } else {
        // New vehicle, or one that changed type because its route changed.
        if (entry) {
          layers[entry.type].removeLayer(entry.marker);
          markers.delete(key);
        }
        addMarker(v);
      }
    });

    // Gone from the feed - trip finished, or out of service.
    for (const [key, entry] of Array.from(markers)) {
      if (!seen.has(key)) {
        layers[entry.type].removeLayer(entry.marker);
        markers.delete(key);
      }
    }

    Object.keys(counts).forEach((t) => (counts[t] = 0));
    vehicles.forEach((v) => (counts[normaliseType(v.type)] += 1));
    renderCounts();

    // Keep an open trip panel in step with the vehicle it's describing.
    if (selectedKey && markers.has(selectedKey)) {
      showTrip(markers.get(selectedKey).vehicle, true);
    }
  }

  async function refreshLive() {
    if (fetching) return;
    fetching = true;
    try {
      const response = await fetch("api/vehicles");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      replaceLiveVehicles(data.vehicles);

      if (data.error) {
        // Server's up but its last poll failed, so these positions are old.
        setStatus(`Feed error, showing last good data: ${data.error}`, true);
      } else {
        const age = data.age_seconds === null ? "?" : Math.round(data.age_seconds);
        setStatus(`Live - ${data.count} vehicles, data ${age}s old`);
      }
      setPulse(true);

      // Wait a second past the server's next poll so we don't re-read old data.
      countdown = Math.max(2, Math.ceil(data.next_refresh_in) + 1);
    } catch (err) {
      console.error("Live update failed:", err);
      setStatus(
        "Live update failed. Is the server running? (python -m uvicorn server:app --reload)",
        true
      );
      setPulse(false);
      countdown = 10;
    } finally {
      fetching = false;
    }
  }

  function tick() {
    if (!liveOn) return;
    countdown -= 1;
    if (countdown <= 0) {
      refreshLive();
      return;
    }
    const el = document.getElementById("live-countdown");
    if (el) el.textContent = `Next refresh in ${countdown}s`;
  }

  function setLiveMode(on) {
    liveOn = on;
    clearInterval(tickTimer);
    tickTimer = null;

    const countdownEl = document.getElementById("live-countdown");
    if (on) {
      countdown = 0;
      refreshLive();
      tickTimer = setInterval(tick, 1000);
    } else {
      setPulse(false);
      setStatus("Live mode off - positions frozen at their last update.");
      if (countdownEl) countdownEl.textContent = "";
    }
  }

  // --- Filter panel --------------------------------------------------------

  // Legend doubles as the controls - type filters, counts and live mode.
  function addFilterPanel() {
    const panel = L.control({ position: "bottomright" });

    panel.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");

      div.innerHTML =
        "<h2>Vehicle types</h2>" +
        Object.entries(TYPE_COLORS)
          .map(
            ([type, color]) => `
              <label>
                <input type="checkbox" data-type="${type}" checked>
                <span class="swatch" style="background:${color}"></span>
                ${type}
                <span class="count" id="count-${type}">0</span>
              </label>`
          )
          .join("") +
        `<div class="total">Total<span class="count" id="count-total">0</span></div>
         <div class="live">
           <label>
             <input type="checkbox" id="live-toggle">
             Live mode
             <span class="pulse" id="live-pulse"></span>
           </label>
           <div class="status" id="live-status">Loading...</div>
           <div class="status" id="live-countdown"></div>
         </div>
         <div class="live">
           <label>
             <input type="checkbox" id="stops-toggle">
             Show stops
           </label>
           <div class="status" id="stops-hint"></div>
         </div>
         <div class="live">
           <label>
             <input type="checkbox" id="alert-toggle">
             Show disruptions
           </label>
           <div class="alerts" id="alert-summary"></div>
         </div>`;

      // Stops checkbox clicks from panning the map underneath.
      L.DomEvent.disableClickPropagation(div);

      div.querySelectorAll("input[data-type]").forEach((box) => {
        box.addEventListener("change", () => {
          const layer = layers[box.dataset.type];
          if (box.checked) {
            layer.addTo(map);
          } else {
            map.removeLayer(layer);
          }
        });
      });

      div
        .querySelector("#live-toggle")
        .addEventListener("change", (event) => setLiveMode(event.target.checked));

      div
        .querySelector("#stops-toggle")
        .addEventListener("change", (event) => setStopsMode(event.target.checked));

      div.querySelector("#alert-toggle").addEventListener("change", (event) => {
        if (event.target.checked) alertLayer.addTo(map);
        else map.removeLayer(alertLayer);
      });

      return div;
    };

    panel.addTo(map);
  }
</script>

</body>
</html>

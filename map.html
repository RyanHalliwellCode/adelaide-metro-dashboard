<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adelaide Metro - Vehicle Map</title>

<!-- Leaflet, loaded from its CDN. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }

  /* Header on top, map fills the rest. */
  body { display: flex; flex-direction: column; }
  header {
    background: #1c2b3a;
    color: white;
    padding: 12px 20px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.75; }

  #map { flex: 1; width: 100%; }

  .legend {
    background: white;
    padding: 10px 14px;
    line-height: 1.6;
    font-size: 14px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    min-width: 190px;
  }
  .legend h2 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #555;
  }
  /* Whole row is clickable, not just the checkbox. */
  .legend label {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .legend .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin: 0 6px;
  }
  .legend .count {
    margin-left: auto;
    padding-left: 12px;
    color: #555;
    font-variant-numeric: tabular-nums;
  }
  .legend .total {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #ddd;
    display: flex;
    font-size: 13px;
    color: #555;
  }
  .legend .total .count { font-weight: 600; }

  .legend .live {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
  }
  .legend .live label { font-weight: 600; }
  .legend .status {
    margin-top: 4px;
    font-size: 12px;
    color: #666;
    line-height: 1.4;
  }
  .legend .status.error { color: #c0392b; }
  /* Dot only pulses while updates are actually coming through. */
  .legend .pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #bbb;
    margin-left: 6px;
  }
  .legend .pulse.on {
    background: #27ae60;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* Trip panel - sits over the map on the left when you click a vehicle. */
  #trip {
    position: absolute;
    top: 84px;
    left: 12px;
    width: 310px;
    max-height: calc(100% - 180px);
    display: none;
    flex-direction: column;
    background: white;
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.4);
    z-index: 1000;
    font-size: 13px;
  }
  #trip.open { display: flex; }
  #trip .head {
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
    border-left: 5px solid #999;
    border-radius: 4px 0 0 0;
  }
  #trip .route { font-size: 15px; font-weight: 600; }
  #trip .sub { color: #666; margin-top: 2px; }
  #trip .meta { color: #888; margin-top: 4px; font-size: 12px; }
  #trip .close {
    float: right;
    cursor: pointer;
    color: #999;
    font-size: 18px;
    line-height: 1;
    padding-left: 8px;
  }
  #trip .zoom {
    display: inline-block;
    margin-top: 6px;
    color: #1c6cb4;
    cursor: pointer;
    font-size: 12px;
  }
  #trip .stops { overflow-y: auto; padding: 6px 0; }
  #trip .stop {
    display: flex;
    gap: 10px;
    padding: 3px 12px;
    line-height: 1.5;
  }
  #trip .stop .t {
    color: #666;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Stops it has already gone past fade out, the one it's heading for stands out. */
  #trip .stop.past { opacity: 0.4; }
  #trip .stop.next { background: #fff5d6; font-weight: 600; }
  #trip .stop.next .t { color: #333; }
  #trip .empty { padding: 12px; color: #888; }
</style>
</head>
<body>

<header>
  <h1>Adelaide Metro - Live Vehicle Locations</h1>
  <p>Vehicle positions from the Adelaide Metro GTFS-realtime feed. Use the panel to filter by type, or switch on live mode to track trains in real time.</p>
</header>

<div id="map"></div>

<div id="trip">
  <div class="head">
    <span class="close" id="trip-close">&times;</span>
    <div class="route" id="trip-route"></div>
    <div class="sub" id="trip-sub"></div>
    <div class="meta" id="trip-meta"></div>
    <span class="zoom" id="trip-zoom">Zoom to route</span>
  </div>
  <div class="stops" id="trip-stops"></div>
</div>

<script>
  // Adelaide city centre, where the map starts.
  const ADELAIDE_CENTER = [-34.9285, 138.6007];

  // Matches classify_vehicle() in main.py. Order sets the panel row order too.
  const TYPE_COLORS = {
    bus: "#1f77b4",
    train: "#d62728",
    tram: "#2ca02c",
    ferry: "#9467bd",
    unknown: "#7f7f7f",
  };

  // Just a placeholder - the server tells us the real list on first response.
  let liveTypes = ["train"];

  const map = L.map("map").setView(ADELAIDE_CENTER, 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  // A layer per type means filtering is one call, not 400 marker updates.
  const layers = {};
  for (const type of Object.keys(TYPE_COLORS)) {
    layers[type] = L.layerGroup().addTo(map);
  }

  const counts = Object.fromEntries(Object.keys(TYPE_COLORS).map((t) => [t, 0]));

  function normaliseType(type) {
    // Anything without a colour falls back to unknown.
    return TYPE_COLORS[type] ? type : "unknown";
  }

  function addMarker(v) {
    const type = normaliseType(v.type);
    const color = TYPE_COLORS[type];
    const marker = L.circleMarker([v.latitude, v.longitude], {
      radius: 6,
      color: color,
      fillColor: color,
      fillOpacity: 0.8,
    });
    marker.on("click", () => showTrip(v));
    marker.addTo(layers[type]);
  }

  function renderCounts() {
    let total = 0;
    for (const [type, n] of Object.entries(counts)) {
      total += n;
      const el = document.getElementById(`count-${type}`);
      if (el) el.textContent = n;
    }
    const totalEl = document.getElementById("count-total");
    if (totalEl) totalEl.textContent = total;
    document.title = `Adelaide Metro - ${total} vehicles`;
  }

  // --- First render, from the static snapshot ------------------------------

  fetch("vehicles.json")
    .then((response) => response.json())
    .then((vehicles) => {
      vehicles.forEach((v) => {
        counts[normaliseType(v.type)] += 1;
        addMarker(v);
      });
      addFilterPanel();
      renderCounts();
    })
    .catch((err) => {
      console.error("Failed to load vehicles.json:", err);
      alert("Could not load vehicles.json. Run 'python main.py' first to generate it.");
    });

  // --- Trip panel ----------------------------------------------------------

  // The line and stop dots for whatever vehicle is currently selected.
  const tripLayer = L.layerGroup().addTo(map);
  let tripBounds = null;

  function closeTrip() {
    document.getElementById("trip").classList.remove("open");
    tripLayer.clearLayers();
    tripBounds = null;
  }

  function drawTripLine(stops, color) {
    tripLayer.clearLayers();
    const points = stops
      .filter((s) => s.latitude !== null && s.longitude !== null)
      .map((s) => [s.latitude, s.longitude]);
    if (!points.length) return;

    L.polyline(points, { color: color, weight: 3, opacity: 0.65 }).addTo(tripLayer);
    points.forEach((p) => {
      L.circleMarker(p, {
        radius: 3,
        color: color,
        fillColor: "white",
        fillOpacity: 1,
        weight: 2,
      }).addTo(tripLayer);
    });
    tripBounds = L.latLngBounds(points);
  }

  function renderStops(data) {
    const list = document.getElementById("trip-stops");
    list.innerHTML = data.stops
      .map((s, i) => {
        // next_stop_index is null once the whole trip is in the past.
        let cls = "stop";
        if (data.next_stop_index === null || i < data.next_stop_index) cls += " past";
        else if (i === data.next_stop_index) cls += " next";
        const time = (s.arrival || s.departure || "").slice(0, 5);
        return `<div class="${cls}"><span class="t">${time}</span><span>${s.name}</span></div>`;
      })
      .join("");

    // Scroll the stop it's heading for into view rather than leaving it buried.
    const next = list.querySelector(".next");
    if (next) next.scrollIntoView({ block: "center" });
  }

  async function showTrip(v) {
    const panel = document.getElementById("trip");
    const type = normaliseType(v.type);
    const color = TYPE_COLORS[type];

    panel.classList.add("open");
    panel.querySelector(".head").style.borderLeftColor = color;
    document.getElementById("trip-route").textContent = `${type} ${v.route_id}`;
    document.getElementById("trip-sub").textContent = "Loading timetable...";
    document.getElementById("trip-meta").textContent = "";
    document.getElementById("trip-stops").innerHTML = "";

    if (!v.trip_id) {
      document.getElementById("trip-sub").textContent = "No trip ID in the feed for this vehicle.";
      return;
    }

    try {
      const response = await fetch(`api/trip/${encodeURIComponent(v.trip_id)}`);
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.detail || `HTTP ${response.status}`);
      }
      const data = await response.json();

      document.getElementById("trip-route").textContent = data.route_name;
      document.getElementById("trip-sub").textContent = data.headsign
        ? `Towards ${data.headsign}`
        : `Route ${data.route_id}`;

      // speed is metres per second in the feed, which means nothing to anyone.
      const bits = [`Vehicle ${v.vehicle_id}`, `Trip ${data.trip_id}`];
      if (v.speed !== null && v.speed !== undefined) {
        bits.push(`${Math.round(v.speed * 3.6)} km/h`);
      }
      document.getElementById("trip-meta").textContent = bits.join(" - ");

      renderStops(data);
      drawTripLine(data.stops, color);
    } catch (err) {
      console.error("Trip lookup failed:", err);
      document.getElementById("trip-sub").textContent = String(err.message || err);
      document.getElementById("trip-stops").innerHTML =
        '<div class="empty">Timetable unavailable. Has gtfs.db been built?</div>';
    }
  }

  document.getElementById("trip-close").addEventListener("click", closeTrip);
  document.getElementById("trip-zoom").addEventListener("click", () => {
    if (tripBounds) map.fitBounds(tripBounds, { padding: [40, 40] });
  });

  // --- Live mode -----------------------------------------------------------

  // Countdown is for show, but hitting zero fires the refresh. Each response
  // resyncs it to the server's next_refresh_in so we don't drift out of step.
  let liveOn = false;
  let countdown = 0;
  let tickTimer = null;
  let fetching = false;

  function statusEl() {
    return document.getElementById("live-status");
  }

  function setStatus(text, isError) {
    const el = statusEl();
    if (!el) return;
    el.textContent = text;
    el.classList.toggle("error", Boolean(isError));
  }

  function setPulse(on) {
    const el = document.getElementById("live-pulse");
    if (el) el.classList.toggle("on", on);
  }

  function replaceLiveVehicles(vehicles) {
    // Only rebuild the live layers - the rest keep their snapshot markers.
    for (const type of liveTypes) {
      if (layers[type]) {
        layers[type].clearLayers();
        counts[type] = 0;
      }
    }
    vehicles.forEach((v) => {
      const type = normaliseType(v.type);
      counts[type] += 1;
      addMarker(v);
    });
    renderCounts();
  }

  async function refreshLive() {
    if (fetching) return;
    fetching = true;
    try {
      const response = await fetch("api/vehicles");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();

      if (Array.isArray(data.live_types) && data.live_types.length) {
        liveTypes = data.live_types;
      }
      replaceLiveVehicles(data.vehicles);

      if (data.error) {
        // Server's up but its last poll failed, so these positions are old.
        setStatus(`Feed error, showing last good data: ${data.error}`, true);
      } else {
        const age = data.age_seconds === null ? "?" : Math.round(data.age_seconds);
        setStatus(`${liveTypes.join(", ")} live - ${data.count} vehicles, data ${age}s old`);
      }
      setPulse(true);

      // Wait a second past the server's next poll so we don't re-read old data.
      countdown = Math.max(2, Math.ceil(data.next_refresh_in) + 1);
    } catch (err) {
      console.error("Live update failed:", err);
      setStatus(
        "Live update failed. Is the server running? (python -m uvicorn server:app --reload)",
        true
      );
      setPulse(false);
      countdown = 10;
    } finally {
      fetching = false;
    }
  }

  function tick() {
    if (!liveOn) return;
    countdown -= 1;
    if (countdown <= 0) {
      refreshLive();
      return;
    }
    const el = document.getElementById("live-countdown");
    if (el) el.textContent = `Next refresh in ${countdown}s`;
  }

  function setLiveMode(on) {
    liveOn = on;
    clearInterval(tickTimer);
    tickTimer = null;

    const countdownEl = document.getElementById("live-countdown");
    if (on) {
      countdown = 0;
      refreshLive();
      tickTimer = setInterval(tick, 1000);
    } else {
      setPulse(false);
      setStatus("Live mode off - showing the vehicles.json snapshot.");
      if (countdownEl) countdownEl.textContent = "";
    }
  }

  // --- Filter panel --------------------------------------------------------

  // Legend doubles as the controls - type filters, counts and live mode.
  function addFilterPanel() {
    const panel = L.control({ position: "bottomright" });

    panel.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");

      div.innerHTML =
        "<h2>Vehicle types</h2>" +
        Object.entries(TYPE_COLORS)
          .map(
            ([type, color]) => `
              <label>
                <input type="checkbox" data-type="${type}" checked>
                <span class="swatch" style="background:${color}"></span>
                ${type}
                <span class="count" id="count-${type}">0</span>
              </label>`
          )
          .join("") +
        `<div class="total">Total<span class="count" id="count-total">0</span></div>
         <div class="live">
           <label>
             <input type="checkbox" id="live-toggle">
             Live mode
             <span class="pulse" id="live-pulse"></span>
           </label>
           <div class="status" id="live-status">Live mode off - showing the vehicles.json snapshot.</div>
           <div class="status" id="live-countdown"></div>
         </div>`;

      // Stops checkbox clicks from panning the map underneath.
      L.DomEvent.disableClickPropagation(div);

      div.querySelectorAll("input[data-type]").forEach((box) => {
        box.addEventListener("change", () => {
          const layer = layers[box.dataset.type];
          if (box.checked) {
            layer.addTo(map);
          } else {
            map.removeLayer(layer);
          }
        });
      });

      div
        .querySelector("#live-toggle")
        .addEventListener("change", (event) => setLiveMode(event.target.checked));

      return div;
    };

    panel.addTo(map);
  }
</script>

</body>
</html>
